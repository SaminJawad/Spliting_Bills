<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#7C3AED" />
  <title>BillSplit – Smart Bill Splitter</title>

  <link rel="stylesheet" href="./css/style.css" />

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

<header class="app-header">
  <div class="header-inner">
    <div class="logo">
      <span class="logo__icon"><i data-lucide="receipt"></i></span>
      <span class="logo__text">BillSplit</span>
    </div>

    <nav class="header-nav">
      <button class="nav-btn active" data-tab="split">
        <span class="nav-btn__icon"><i data-lucide="split"></i></span>
        <span>Split</span>
      </button>

      <button class="nav-btn" data-tab="history">
        <span class="nav-btn__icon"><i data-lucide="history"></i></span>
        <span>History</span>
      </button>
    </nav>
  </div>
</header>

<main class="app-main">

<section id="tab-split" class="tab active">

<!-- STEP 1 -->
<article class="card">
  <header class="card__header">
    <span class="step-badge">1</span>
    <h2>Bill Details</h2>
  </header>

  <div class="card__body">

    <label>Occasion</label>
    <input id="bill-name" type="text" placeholder="Dinner, Trip..." />

    <label>Total Amount</label>
    <input id="total-amount" type="number" placeholder="0.00" />

    <label>Tax %</label>
    <input id="tax-pct" type="number" placeholder="0" />

    <label>Tip %</label>
    <input id="tip-pct" type="number" placeholder="10" />

  </div>
</article>

<!-- STEP 2 -->
<article class="card">
  <header class="card__header">
    <span class="step-badge">2</span>
    <h2>Members</h2>
  </header>

  <div class="card__body">

    <div class="add-member-row">
      <input id="new-member-name" type="text" placeholder="Add name" />
      <button id="add-member-btn">
        <i data-lucide="plus"></i>
      </button>
    </div>

    <ul id="members-list"></ul>

  </div>
</article>

<!-- STEP 3 -->
<article class="card">
  <header class="card__header">
    <span class="step-badge">3</span>
    <h2>Split Method</h2>
  </header>

  <div class="card__body">

    <button data-method="equal">
      <i data-lucide="equal"></i> Equal
    </button>

    <button data-method="percentage">
      <i data-lucide="percent"></i> Percentage
    </button>

    <button data-method="custom">
      <i data-lucide="edit"></i> Custom
    </button>

  </div>
</article>

<!-- CALCULATE -->
<button id="calculate-btn">
  <i data-lucide="calculator"></i> Calculate
</button>

<!-- RESULTS -->
<article id="results-card" class="card hidden">

  <h2>Results</h2>

  <ul id="results-list"></ul>

  <div class="actions">
    <button id="copy-btn"><i data-lucide="copy"></i></button>
    <button id="share-btn"><i data-lucide="share-2"></i></button>
    <button id="save-btn"><i data-lucide="save"></i></button>
  </div>

</article>

</section>

<section id="tab-history" class="tab hidden">
  <h2>History</h2>
  <ul id="history-list"></ul>
</section>

</main>

<script src="./js/app.js"></script>

<script>
  lucide.createIcons();
</script>

</body>
</html>
